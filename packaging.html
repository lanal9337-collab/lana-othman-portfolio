<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packaging — Lana Othman</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f5ef;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .sub {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 30px 100px;
    }

    .back {
      display: inline-block;
      margin-bottom: 70px;
      color: #171717;
      text-decoration: none;
      font-size: 14px;
    }

    .section-no {
      font-size: 12px;
      color: #77736b;
      margin-bottom: 12px;
      letter-spacing: .08em;
    }

    h1 {
      font-size: clamp(60px, 10vw, 150px);
      line-height: .9;
      margin: 0 0 100px;
      letter-spacing: -.06em;
    }

    .project {
      margin-bottom: 140px;
    }

    h2 {
      font-size: 32px;
      margin: 0 0 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    figure {
      margin: 0;
    }

    figure img {
      width: 100%;
      display: block;
    }

    figcaption {
      padding: 10px 0 0;
      font-size: 12px;
      color: #77736b;
    }

    @media (max-width: 700px) {
      .sub { padding: 25px 18px 70px; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
