<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lana Othman — Project 02</title>
<link rel="stylesheet" href="style.css">

<style>
.project-page{background:#050505;color:#f4f4f0;min-height:100vh}
.project-nav{position:fixed;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid #252525;background:rgba(5,5,5,.92);backdrop-filter:blur(14px);z-index:20}
.project-nav a{color:#f4f4f0;text-decoration:none;text-transform:uppercase;font-size:12px;letter-spacing:.12em}
.project-logo{font-size:24px;font-weight:800;letter-spacing:-.08em}
.project-logo span{color:#b7e600}
.project-main{padding:76px 4vw 0}
.project-intro{min-height:70vh;display:flex;flex-direction:column;justify-content:flex-end;padding:8vw 0 7vw}
.project-number{color:#b7e600;font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:30px}
.project-intro h1{font-size:clamp(64px,12vw,180px);line-height:.82;letter-spacing:-.07em;margin:0}
.project-intro h1 i{font-weight:300}
.project-info{display:grid;grid-template-columns:1fr 1fr;gap:40px;border-top:1px solid #292929;padding-top:22px;margin-top:60px}
.project-info p{margin:0;color:#92928d;font-size:14px;line-height:1.7}
.project-info strong{display:block;color:#f4f4f0;font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:100px}
.gallery img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .6s}
.gallery a{display:block;overflow:hidden;background:#111}
.gallery a:hover img{transform:scale(1.025);filter:brightness(1.08)}
.gallery .wide{grid-column:1/-1}
.project-footer{border-top:1px solid #292929;padding:60px 0 100px;display:flex;justify-content:space-between}
.project-footer a{color:#f4f4f0;text-decoration:none;text-transform:uppercase;font-size:12px;letter-spacing:.12em}
.project-footer a:hover{color:#b7e600}
@media(max-width:700px){
.project-nav{padding:0 20px}.project-main{padding-left:20px;padding-right:20px}
.project-intro{min-height:65vh}.project-info{grid-template-columns:1fr}
.gallery{grid-template-columns:1fr;gap:10px}.gallery .wide{grid-column:auto}
}
</style>
</head>
