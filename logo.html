<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logo — Lana Othman</title>

  <style>
    @font-face{
      font-family:Acumin;
      src:local("Acumin Variable Concept");
      font-weight:100 900;
    }

    :root{
      --bg:#030303;
      --fg:#f2f2ed;
      --muted:#777772;
      --line:#242424;
      --lime:#b7e600;
      --pad:clamp(22px,5vw,78px);
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:Acumin,Inter,Arial,sans-serif;
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    /* NAV */

    .project-nav{
      position:fixed;
      z-index:20;
      top:0;
      left:0;
      right:0;
      height:76px;
      padding:0 var(--pad);
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(3,3,3,.94);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .logo{
      font-size:22px;
      font-weight:900;
      letter-spacing:-.08em;
    }

    .logo span{
      color:var(--lime);
      font-size:8px;
      margin-left:3px;
    }

    .back{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.16em;
      color:#aaa;
      transition:.25s ease;
    }

    .back:hover{
      color:var(--lime);
    }

    /* INTRO */

    .sub{
      max-width:1500px;
      margin:0 auto;
      padding:150px var(--pad) 0;
    }

    .intro-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      border-bottom:1px solid var(--line);
      padding-bottom:18px;
    }

    .section-no{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.17em;
      color:var(--lime);
    }

    .year{
      font-size:10px;
      letter-spacing:.16em;
      color:var(--muted);
    }

    .project-intro{
      padding:65px 0 110px;
    }

    .project-number{
      display:block;
      margin-bottom:18px;
      color:var(--lime);
      opacity:.65;
      font-size:10px;
      letter-spacing:.16em;
    }

    h1{
      font-size:clamp(90px,16vw,230px);
      line-height:.72;
      letter-spacing:-.085em;
      font-weight:850;
      margin:0;
    }

    .intro-description{
      max-width:390px;
      margin:65px 0 0 auto;
      color:var(--muted);
      font-size:15px;
      line-height:1.35;
    }

    /* PROJECT */

    .project{
      margin:0 0 150px;
    }

    .project-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      border-top:1px solid var(--line);
      padding-top:18px;
      margin-bottom:30px;
    }

    .project-index{
      display:block;
      margin-bottom:12px;
      font-size:10px;
      letter-spacing:.16em;
      color:var(--lime);
    }

    h2{
      font-size:clamp(42px,6vw,86px);
      line-height:.82;
      letter-spacing:-.065em;
      font-weight:700;
      margin:0;
    }

    .project-count{
      color:var(--muted);
      font-size:10px;
      letter-spacing:.15em;
      text-transform:uppercase;
    }

    /* GALLERY */

    .gallery{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px;
    }

    figure{
      position:relative;
      margin:0;
      overflow:hidden;
      background:#050505;
    }

    figure img{
      position:relative;
      z-index:1;
      display:block;
      width:100%;
      height:auto;
      filter:none;
      transform:scale(1.001);
      transition:
        transform .9s cubic-bezier(.2,.7,.2,1);
    }

    figure:hover img{
      transform:scale(1.035);
    }

    figcaption{
      position:absolute;
      z-index:3;
      left:18px;
      bottom:16px;
      color:#d0d0ca;
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      opacity:.7;
      transition:.4s ease;
    }

    figure:hover figcaption{
      color:var(--lime);
      opacity:1;
    }

    /* FIRST IMAGE LARGE */

    .gallery figure:first-child{
      grid-column:1 / -1;
    }

    /* FOOTER */

    .project-footer{
      margin-top:40px;
      padding:25px var(--pad);
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:var(--muted);
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .project-footer a{
      transition:.25s ease;
    }

    .project-footer a:hover{
      color:var(--lime);
    }

    /* MOBILE */

    @media(max-width:800px){

      .project-nav{
        height:68px;
      }

      .sub{
        padding:120px 20px 0;
      }

      .intro-top{
        padding-bottom:14px;
      }

      .project-intro{
        padding:50px 0 80px;
      }

      h1{
        font-size:25vw;
      }

      .intro-description{
        margin:45px 0 0;
        font-size:14px;
      }

      .project{
        margin-bottom:100px;
      }

      .project-head{
        display:block;
        margin-bottom:20px;
      }

      h2{
        font-size:15vw;
      }

      .project-count{
        display:block;
        margin-top:15px;
      }

      .gallery{
        grid-template-columns:1fr;
        gap:12px;
      }

      .gallery figure:first-child{
        grid-column:auto;
      }

      figure img{
        filter:none;
      }

      .project-footer{
        padding:20px;
        display:block;
        line-height:2;
      }
    }
  </style>
</head>

<body>

        </figure>

        <figure>
          <img src="images/logo/logo-09.jpg" alt="Logo design 09">

        </figure>

      </div>

    </section>

  </main>


  <footer class="project-footer">

    <span>© 2026 Lana Othman</span>

    <a href="index.html">
      Back to Work ↗
    </a>

  </footer>

</body>
</html>
