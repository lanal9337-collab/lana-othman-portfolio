<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo — Lana Othman</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f5ef;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .sub {
      max-width: 1440px;
      margin: auto;
      padding: 40px 30px 100px;
    }

    .back {
      display: inline-block;
      margin-bottom: 70px;
      color: #171717;
      text-decoration: none;
      font-size: 14px;
    }

    .section-no {
      font-size: 12px;
      color: #77736b;
      margin-bottom: 12px;
      letter-spacing: .08em;
    }

    h1 {
      font-size: clamp(60px, 10vw, 150px);
      line-height: .9;
      margin: 0 0 100px;
      letter-spacing: -.06em;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    figure {
      margin: 0;
    }

    figure img {
      width: 100%;
      display: block;
    }

    figcaption {
      padding: 10px 0 0;
      font-size: 12px;
      color: #77736b;
    }

    @media (max-width: 700px) {
      .sub { padding: 25px 18px 70px; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<main class="sub">

<a class="back" href="index.html">← Back to work</a>

<div class="section-no">SELECTED MARKS</div>
<h1>Logo</h1>

<div class="gallery">

<figure><img src="images/logo/logo-01.jpg" alt="Logo design 01"><figcaption>Logo — 01</figcaption></figure>
<figure><img src="images/logo/logo-02.jpg" alt="Logo design 02"><figcaption>Logo — 02</figcaption></figure>
<figure><img src="images/logo/logo-03.jpg" alt="Logo design 03"><figcaption>Logo — 03</figcaption></figure>
<figure><img src="images/logo/logo-04.jpg" alt="Logo design 04"><figcaption>Logo — 04</figcaption></figure>
<figure><img src="images/logo/logo-05.jpg" alt="Logo design 05"><figcaption>Logo — 05</figcaption></figure>
<figure><img src="images/logo/logo-06.jpg" alt="Logo design 06"><figcaption>Logo — 06</figcaption></figure>
<figure><img src="images/logo/logo-07.jpg" alt="Logo design 07"><figcaption>Logo — 07</figcaption></figure>
<figure><img src="images/logo/logo-08.jpg" alt="Logo design 08"><figcaption>Logo — 08</figcaption></figure>
<figure><img src="images/logo/logo-09.jpg" alt="Logo design 09"><figcaption>Logo — 09</figcaption></figure>

</div>

</main>

</body>
</html>
